name: Aperçu V1 privé MIMMO
on:
  push:
    branches: [feat/integrated-v1]
permissions:
  contents: read
concurrency:
  group: mimmo-v1-private-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.repository == 'delabarremax-svg/Mimmo' && github.ref == 'refs/heads/feat/integrated-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:accounts
      - run: npm run build:v1-demo
      - run: npx --no-install wrangler deploy --config deploy/wrangler-v1-demo.json --dry-run --outdir work/v1-worker-build
      - name: Publier uniquement la nouvelle démonstration fictive privée
        run: node scripts/deploy-private-demo.mjs --v1-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          CONFIRM_FREE_PLAN: "true"
