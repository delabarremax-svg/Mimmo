name: Aperçu V1 privé MIMMO (autorisation manuelle)
on:
  workflow_dispatch:
    inputs:
      target:
        description: Espace privé à mettre à jour
        type: choice
        options: [accounts, fictitious-demo]
        default: accounts
        required: true
      confirm_private_preview:
        description: Le fondateur autorise ce déploiement privé de la révision sélectionnée
        type: boolean
        default: false
        required: true
      confirm_free_plan:
        description: Workers Free confirmé, aucune option payante
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: mimmo-v1-private-preview
  cancel-in-progress: false
jobs:
  preview:
    if: >-
      github.repository == 'delabarremax-svg/Mimmo' &&
      contains(fromJSON('["refs/heads/feat/v1-completion-audit","refs/heads/feat/integrated-v1","refs/heads/main"]'), github.ref) &&
      inputs.confirm_private_preview == true && inputs.confirm_free_plan == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Contrôler les démonstrations existantes en lecture seule
        run: node scripts/audit-live-v1.mjs
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
      - name: Compiler l’espace de comptes
        if: inputs.target == 'accounts'
        run: npm run build:accounts
      - name: Compiler la démonstration fictive distincte
        if: inputs.target == 'fictitious-demo'
        run: npm run build:v1-demo
      - name: Mettre à jour uniquement l’espace de comptes privé autorisé
        if: inputs.target == 'accounts'
        run: node scripts/deploy-v1-accounts.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          CONFIRM_FREE_PLAN: "true"
      - name: Mettre à jour uniquement la démonstration fictive autorisée
        if: inputs.target == 'fictitious-demo'
        run: node scripts/deploy-private-demo.mjs --v1-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          CONFIRM_FREE_PLAN: "true"
