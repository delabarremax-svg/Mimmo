name: Aperçu comptes MIMMO (manuel)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mimmo-accounts-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/feat/private-accounts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:accounts
      - name: Préparer et publier le Worker distinct
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SESSION_KEY: ${{ secrets.MIMMO_SESSION_KEY }}
        run: node scripts/deploy-accounts.mjs
