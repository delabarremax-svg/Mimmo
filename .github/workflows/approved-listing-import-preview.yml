name: Aperçu comptes PR 7 autorisé 6 novembre
on:
  push:
    branches: [ops/approved-listing-import-20261106]
    paths: [.github/workflows/approved-listing-import-preview.yml]
permissions:
  contents: read
concurrency:
  group: mimmo-v1-private-preview
  cancel-in-progress: true
jobs:
  authorized-preview:
    if: >-
      github.repository == 'delabarremax-svg/Mimmo' &&
      github.ref == 'refs/heads/ops/approved-listing-import-20261106' &&
      github.event.head_commit.message == 'Deploy authorized listing import preview 2026-11-06'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
      MIMMO_CHROMIUM: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bfa5b1ada3e8141f0adaaf029ba29b1ce929d94f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Vérifier les retours Supabase avec des liens volontairement invalides sans envoi email
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          const {vars}=JSON.parse(await readFile('deploy/wrangler-v1-accounts.json','utf8'));
          const origin='https://mimmo-v1-comptes-privee.delabarre-max.workers.dev';
          for(const path of ['/api/confirm','/api/recover',null]) {
            const url=new URL('/auth/v1/verify',vars.SUPABASE_URL);
            url.searchParams.set('token','0'.repeat(64));
            url.searchParams.set('type',path==='/api/recover'?'recovery':'signup');
            if(path)url.searchParams.set('redirect_to',origin+path);
            const r=await fetch(url,{redirect:'manual',headers:{apikey:vars.SUPABASE_PUBLISHABLE_KEY},signal:AbortSignal.timeout(15000)});
            const location=r.headers.get('Location');
            const dest=location?new URL(location):null;
            const ok=[302,303].includes(r.status)&&dest?.origin===origin&&dest?.pathname===(path||'/')&&(dest.searchParams.has('error')||new URLSearchParams(dest.hash.slice(1)).has('error'));
            console.log(JSON.stringify({check:path||'Site URL',status:r.status,redirectOrigin:dest?.origin,redirectPath:dest?.pathname,ok}));
            if(!ok)throw new Error('Retour Supabase à corriger avant déploiement. Aucun email ni utilisateur créé.');
          }
          JS
      - name: Conserver les empreintes des trois démonstrations à préserver
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          cat > work-preserve-demos.mjs <<'JS'
          import {createHash} from 'node:crypto';
          import {writeFile,readFile} from 'node:fs/promises';
          const before=process.argv.includes('--before');
          const auth='Basic '+Buffer.from('mimmo:'+process.env.DEMO_PASSWORD).toString('base64');
          const values={};
          for(const name of ['mimmo-demo-privee','mimmo-demo-ux','mimmo-v1-privee']){
            const origin=`https://${name}.delabarre-max.workers.dev`;
            const deny=await fetch(origin,{redirect:'manual',signal:AbortSignal.timeout(15000)});
            if(deny.status!==401)throw new Error('Protection de démonstration à examiner.');
            const r=await fetch(origin,{redirect:'manual',headers:{Authorization:auth},signal:AbortSignal.timeout(15000)});
            if(r.status!==200)throw new Error('Démonstration inaccessible.');
            const html=await r.text();const hash=createHash('sha256').update(html);
            for(const [,path] of html.matchAll(/(?:src|href)="(\/assets\/[^"\s]+)"/g)){
              const asset=await fetch(origin+path,{redirect:'manual',headers:{Authorization:auth},signal:AbortSignal.timeout(15000)});
              if(asset.status!==200)throw new Error('Fichier indisponible.');
              hash.update(new Uint8Array(await asset.arrayBuffer()));
            }
            values[name]=hash.digest('hex');
          }
          if(before)await writeFile('work-preserved-demos.json',JSON.stringify(values));
          else{
            const expected=JSON.parse(await readFile('work-preserved-demos.json','utf8'));
            if(JSON.stringify(values)!==JSON.stringify(expected))throw new Error('Une démonstration a changé : examiner avant de communiquer le lien.');
            console.log('Trois démonstrations préservées : HTML/JS/CSS identiques et protection anonyme 401.');
          }
          JS
          node work-preserve-demos.mjs --before
      - run: npm run build:accounts
      - name: Utiliser Chrome déjà installé sur le runner
        run: /usr/bin/google-chrome --version
      - name: Valider les trois parcours locaux avant publication privée
        run: |
          node scripts/check-listing-import.mjs
          npx --no-install esbuild scripts/check-listing-network.ts --bundle --platform=node --format=esm --outfile=work/check-listing-network.mjs
          node work/check-listing-network.mjs
      - name: Déployer uniquement la révision autorisée de l’espace comptes existant
        run: node scripts/deploy-v1-accounts.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          CONFIRM_FREE_PLAN: "true"
      - name: Vérifier que les démonstrations sont restées identiques
        if: always()
        run: |
          if [ -f work-preserved-demos.json ]; then node work-preserve-demos.mjs; fi
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
      - name: Vérifier les callbacks déployés sans envoyer d’email
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          node --input-type=module <<'JS'
          const origin='https://mimmo-v1-comptes-privee.delabarre-max.workers.dev';
          const Authorization='Basic '+Buffer.from('mimmo:'+process.env.DEMO_PASSWORD).toString('base64');
          for(const path of ['/api/confirm?code=mimmo-invalid-test','/api/recover?code=mimmo-invalid-test']){
            const r=await fetch(origin+path,{headers:{Authorization},redirect:'manual',signal:AbortSignal.timeout(15000)});
            if(r.status!==303||r.headers.get('Location')!=='/?auth_notice=email_link_invalid#')throw new Error('Correction email non vérifiée.');
            if(!r.headers.get('Cache-Control')?.includes('no-store'))throw new Error('Protection cache absente.');
            console.log('Retour standard contrôlé : '+new URL(origin+path).pathname);
          }
          JS
      - name: Vérifier la révision publiée, l’interface iPhone et les erreurs de liens
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          node --input-type=module <<'JS'
          import {chromium} from '@playwright/test';
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const origin='https://mimmo-v1-comptes-privee.delabarre-max.workers.dev';
          const auth='Basic '+Buffer.from('mimmo:'+process.env.DEMO_PASSWORD).toString('base64');
          const html=await readFile('dist/index.html','utf8');
          const digest=value=>createHash('sha256').update(value).digest('hex');
          for(const path of ['/',...Array.from(html.matchAll(/(?:src|href)="(\/assets\/[^"\s]+)"/g),m=>m[1])]){
            const r=await fetch(origin+path,{headers:{Authorization:auth},redirect:'manual',signal:AbortSignal.timeout(15000)});
            const local=await readFile(path==='/'?'dist/index.html':'dist'+path);
            if(r.status!==200||digest(new Uint8Array(await r.arrayBuffer()))!==digest(local))throw new Error('Révision publiée différente des fichiers compilés autorisés.');
          }
          const browser=await chromium.launch({executablePath:process.env.MIMMO_CHROMIUM});
          try{
            const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,httpCredentials:{username:'mimmo',password:process.env.DEMO_PASSWORD}});
            let mutations=0; const errors=[];
            await context.route('**/api/**',route=>{
              if(route.request().method()!=='GET'){mutations++;return route.abort();}
              return route.continue();
            });
            const page=await context.newPage();page.on('pageerror',e=>errors.push(e.message));
            await page.goto(origin);
            await page.getByRole('heading',{name:'Reprenez votre projet.'}).waitFor();
            if(await page.getByRole('button',{name:'Charger les deux projets fictifs'}).count())throw new Error('Fixtures visibles dans l’espace comptes.');
            for(const width of [320,390,430]){
              await page.setViewportSize({width,height:844});
              if(!(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth)))throw new Error('Débordement mobile.');
            }
            await page.getByRole('button',{name:'Créer un compte',exact:true}).click();
            await page.getByRole('heading',{name:'Créons votre compte.'}).waitFor();
            await page.getByRole('button',{name:'J’ai déjà un compte'}).click();
            await page.getByRole('button',{name:'Mot de passe oublié ?'}).click();
            await page.getByRole('button',{name:'Recevoir le lien de récupération'}).waitFor();
            for(const path of ['/api/confirm?code=invalid-mobile-check','/api/recover?code=invalid-mobile-check']){
              await page.goto(origin+path);
              await page.getByText(/Lien expiré ou ouvert dans un autre navigateur/).waitFor();
              if(new URL(page.url()).searchParams.has('code'))throw new Error('Code non retiré de l’adresse de retour.');
            }
            if(errors.length||mutations)throw new Error('Erreur JavaScript ou tentative d’écriture.');
            console.log('Révision PR 7 (bfa5b1a) publiée vérifiée ; interface comptes 320/390/430px et retours emails standard validés. Aucun email, utilisateur ou bien créé.');
          }finally{await browser.close();}
          JS
      - name: Vérifier les exemples et moteurs OCR publiés sans session utilisateur
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          cat > work/check-published-listings.ts <<'TS'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { parseListingHtml } from '../server/listing-parser';
          const origin='https://mimmo-v1-comptes-privee.delabarre-max.workers.dev';
          const Authorization='Basic '+Buffer.from('mimmo:'+process.env.DEMO_PASSWORD).toString('base64');
          const digest=(v:Uint8Array)=>createHash('sha256').update(v).digest('hex');
          const paths=['/import-examples/appartement-fictif.html','/import-examples/maison-fictive.html','/import-examples/example.css','/import-examples/illustration-fictive.svg','/pdf.worker.mjs','/ocr/worker.min.js','/ocr/lang/fra.traineddata.gz'];
          for(const path of paths){
            const deny=await fetch(origin+path,{redirect:'manual',signal:AbortSignal.timeout(20000)});
            if(deny.status!==401)throw new Error('Ressource privée accessible sans protection.');
            const r=await fetch(origin+path,{headers:{Authorization},redirect:'manual',signal:AbortSignal.timeout(20000)});
            if(r.status!==200 || !r.headers.get('Cache-Control')?.includes('no-store'))throw new Error('Ressource privée indisponible.');
            const data=new Uint8Array(await r.arrayBuffer());
            if(digest(data)!==digest(await readFile('dist'+path)))throw new Error('Ressource différente de la révision autorisée.');
            if(path.endsWith('.html')){
              const result=parseListingHtml(new TextDecoder().decode(data),origin+path);
              const fields=[...new Set(result.evidence.map(x=>x.field))];
              if(fields.length!==8)throw new Error('Extraction exemple publié incomplète.');
              console.log(JSON.stringify({source:path,fictitious:true,fields}));
            }else console.log('Ressource locale PDF/OCR/exemple publiée et protégée : '+path);
          }
          console.log('Aucune session utilisateur créée, aucun bien consulté ou modifié ; exemples publiés explicitement fictifs.');
          TS
          npx --no-install esbuild work/check-published-listings.ts --bundle --platform=node --format=esm --outfile=work/check-published-listings.mjs
          node work/check-published-listings.mjs
